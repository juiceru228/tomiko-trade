version: '3'
services:
    nginx:
      restart: always
      build:
        context: ./nginx
        dockerfile: Dockerfile
      image: nginx:latest
      expose:
        - 8080
      ports:
        - 8080:8080
      volumes:
        - ./nginx:/etc/nginx/conf.d
        - ./server/media:/app/media
      depends_on:
        - server
        - client
    server:
      env_file:
        - .env
      restart: always 
      build:
        context: ./server/
        dockerfile: Dockerfile
      volumes:
        - ./server/media:/app/media
        - ./server:/app 
      expose:
        - 4000
      ports:
        - 4000:4000
      environment:
        - DJANGO_SETTINGS_MODULE=tomiko_trade.settings
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres_password
      depends_on:
        postgres:
          condition: service_healthy
    celery-worker:
      env_file:
        - .env
      build:
        context: ./server/
        dockerfile: Dockerfile
      command: celery -A tomiko_trade worker --loglevel=info
      volumes:
        - ./server:/app
      environment:
        - DJANGO_SETTINGS_MODULE=tomiko_trade.settings
        - REDIS_URL=redis://redis:6379/0
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres_password
      depends_on:
        - server
        - redis

    celery-beat:
      env_file:
        - .env
      build:
        context: ./server/
        dockerfile: Dockerfile
      command: celery -A tomiko_trade beat --loglevel=info
      volumes:
        - ./server:/app
      environment:
        - DJANGO_SETTINGS_MODULE=tomiko_trade.settings
        - REDIS_URL=redis://redis:6379/0
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres_password
      depends_on:
        - server
        - redis

    client:
      env_file:
        - .env
      restart: always
      build:
        context: ./client
        dockerfile: Dockerfile
      volumes:
        - /app/node_modules
        - ./client:/app
      expose:
        - 8000
      ports:
        - 8000:8000

    postgres:
      image: postgres
      ports:
          - 5432:5432
      environment:
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=postgres_password
          - POSTGRES_DB=parking
      volumes:
          - ./server/database:/docker-entrypoint-initdb.d
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
    redis:
      image: redis:latest
      ports:
        - 6379:6379
